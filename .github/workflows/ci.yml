name: CI

on:
    push:

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@main
            - run: uv sync --locked
            - run: uv run mypy rag_config_errores.py
            - run: uv run pytest
            - uses: docker/build-push-action@v5
              with:
                context: .
                push: false